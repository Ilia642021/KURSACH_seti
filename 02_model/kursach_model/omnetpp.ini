[General]
network = KursachNetwork
sim-time-limit = 60s
ned-path = .

# Store results in shared project folder
result-dir = ../../03_results/omnetpp
output-vector-file = "${resultdir}/${configname}-${runnumber}.vec"
output-scalar-file = "${resultdir}/${configname}-${runnumber}.sca"

# Record delay statistics for analysis
**.scalar-recording = true
**.vector-recording = true
**.statistic-recording = true
**.app[*].rtt.scalar-recording = true
**.app[*].rtt.vector-recording = true
**.app[*].rtt.result-recording-modes = "stats,vector"

# Temporarily show app logs during measurement/debug
cmdenv-express-mode = false

# Enable OSPF for internal routing (HQ <-> Branches)
*.core.hasOspf = true
*.br1R.hasOspf = true
*.br2R.hasOspf = true
*.isp.hasOspf = true
**.ospf.ospfConfig = xmldoc("ASConfig.xml")

# IPv4 configuration: Use custom routing for Core-ISP link to ensure failover
**.configurator.config = xmldoc("routing.xml")
**.configurator.addStaticRoutes = false
**.configurator.addDefaultRoutes = true
**.configurator.addSubnetRoutes = true

# Traffic model (packet size must be 800B per assignment)
**.messageLength = 800B

# Application settings
**.numApps = 1
**.app[0].typename = "PingApp"
**.app[0].sendInterval = 1s
**.app[0].printPing = true

# Targets and timing (Wait 5s for OSPF and routing setup)
*.cab1.h1.app[0].destAddr = "KursachNetwork.hqSrv[0]"
*.cab1.h1.app[0].startTime = 5s

*.br1Host[0].app[0].destAddr = "KursachNetwork.hqSrv[1]"
*.br1Host[0].app[0].startTime = 5s

*.cab1.h2.app[0].destAddr = "KursachNetwork.inetHost"
*.cab1.h2.app[0].startTime = 5s

# Default: no apps for other nodes
*.cab*.h*.numApps = 0
*.cab1.h1.numApps = 1
*.cab1.h2.numApps = 1
*.br1Host[*].numApps = 0
*.br1Host[0].numApps = 1
*.br2Host[*].numApps = 0
*.hqSrv[*].numApps = 0
*.inetHost.numApps = 0

# --- Experiments (A/B/C/D) ---

[Config A_Base]
description = "A: base (primary Internet link up, reserve disabled)"
*.numHqHosts = 30
*.scenarioManager.script = xml( \
        "<script>\n" + \
        "<at t='1s'><shutdown module='core.ppp[3]'/></at>\n" + \
        "</script>")

[Config B_ReserveEnabled]
description = "B: reserve link enabled (both Internet links up)"
*.numHqHosts = 30
*.scenarioManager.script = xml("<empty/>")

[Config C_FailurePrimary]
description = "C: failure of primary Internet link at 10s, recovery at 25s"
*.numHqHosts = 30
*.scenarioManager.script = xml( \
        "<script>\n" + \
        "<at t='10s'><shutdown module='core.ppp[2]'/></at>\n" + \
        "<at t='25s'><startup module='core.ppp[2]'/></at>\n" + \
        "</script>")

[Config D_ScaleUp]
description = "D: scaling (+13 HQ hosts) with reserve enabled"
*.numHqHosts = 43
*.scenarioManager.script = xml("<empty/>")
